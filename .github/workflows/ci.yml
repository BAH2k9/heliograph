name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khet
          POSTGRES_PASSWORD: khet
          POSTGRES_DB: khet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KHET_TEST_DB: "Host=127.0.0.1;Port=5432;Database=khet_test;Username=khet;Password=khet"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Khet.slnx
      - run: dotnet build Khet.slnx --no-restore
      - run: dotnet test Khet.slnx --no-build
      # CI otherwise never builds a container image, so a broken Docker build
      # context (e.g. a new ProjectReference escaping ./api) only surfaces at
      # deploy time. Go through compose so the context/dockerfile wiring is
      # exercised too, not just the Dockerfile.
      - name: Build API image via compose
        env:
          POSTGRES_PASSWORD: dummy
          JWT_SIGNING_KEY: dummy
        run: docker compose build api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
