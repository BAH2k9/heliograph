name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heliograph
          POSTGRES_PASSWORD: heliograph
          POSTGRES_DB: heliograph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heliograph"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HELIOGRAPH_TEST_DB: "Host=127.0.0.1;Port=5432;Database=heliograph_test;Username=heliograph;Password=heliograph"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Heliograph.slnx
      - run: dotnet build Heliograph.slnx --no-restore
      - run: dotnet test Heliograph.slnx --no-build
      # Heliograph.Engine is published as a NuGet package on an engine-v* tag
      # (engine-publish.yml). Pack it here too, so broken package metadata shows
      # up on the PR rather than at release time.
      - run: dotnet pack Heliograph.Engine/Heliograph.Engine.csproj -o "$RUNNER_TEMP/nupkg"
      # CI otherwise never builds a container image, so a broken Docker build
      # context (e.g. a new ProjectReference escaping backend/) only surfaces at
      # deploy time. Go through compose so the context/dockerfile wiring is
      # exercised too, not just the Dockerfile.
      - name: Build API image via compose
        working-directory: .
        env:
          POSTGRES_PASSWORD: dummy
          JWT_SIGNING_KEY: dummy
        run: docker compose -f infra/docker-compose.yml build api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
