name: Publish Heliograph.Engine

# Pushing a tag such as engine-v0.1.0 tests the engine, packs Heliograph.Engine at that version
# and pushes it to nuget.org. The tag is the only source of the published version.
#
# Publishes with nuget.org Trusted Publishing, not a stored API key: the job gets a GitHub OIDC
# token, and NuGet/login trades it for a one-hour, single-use nuget.org key. That only works if
# nuget.org has a Trusted Publishing policy for this repo and this workflow file
# (engine-publish.yml). The repo secret NUGET_USER holds the nuget.org username (the profile
# name, not the email) of the account that owns the policy.

on:
  push:
    tags:
      - "engine-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for the OIDC token NuGet/login exchanges
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#engine-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not engine-v<semver>, e.g. engine-v0.1.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: dotnet build Heliograph.Engine/Heliograph.Engine.csproj -c Release -warnaserror
      - run: dotnet test Heliograph.Engine.Tests/Heliograph.Engine.Tests.csproj -c Release

      - name: Pack
        run: >-
          dotnet pack Heliograph.Engine/Heliograph.Engine.csproj -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -o "$RUNNER_TEMP/nupkg"

      - uses: actions/upload-artifact@v4
        with:
          name: Heliograph.Engine.${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/nupkg/*.nupkg

      # Right before the push: the key this returns expires after an hour.
      - name: Get a short-lived nuget.org key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "$RUNNER_TEMP/nupkg/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
