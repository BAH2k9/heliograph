services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: khet
      POSTGRES_USER: khet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khet -d khet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # Context is backend/, not backend/api, because Khet.Api.csproj has a
      # ProjectReference to ../Khet.Engine which must be inside the build context.
      context: ../backend
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__KhetDb: Host=db;Port=5432;Database=khet;Username=khet;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_SIGNING_KEY}
    volumes:
      # Bind mount, not a named volume — lands log files directly on the host filesystem at
      # /opt/khet/logs (repo root, one level up from this compose file in infra/) so they're
      # readable (tail/cat) without any docker exec/docker-group access.
      # See GOTCHAS.md for the sanctioned retrieval path.
      - ../logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../web
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - default
      - edge
    depends_on:
      - api
      - web

networks:
  # Caddy <-> cloudflared only. A network of its own, with a fixed subnet, so the Caddyfile can
  # trust exactly one address (172.30.53.2, reserved for the cloudflared service the tunnel adds)
  # rather than all of `default`, which holds api/web/db. Dynamic allocation is confined to
  # .8-.15 so nothing else can ever be handed .2. Declared before cloudflared exists on purpose:
  # the login limiter's trust boundary is in place (and testable) before the tunnel is.
  edge:
    ipam:
      config:
        - subnet: 172.30.53.0/28
          ip_range: 172.30.53.8/29

volumes:
  db-data:
