name: heliograph

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: heliograph
      POSTGRES_USER: heliograph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heliograph -d heliograph"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # Context is backend/, not backend/api, because Heliograph.Api.csproj has a
      # ProjectReference to ../Heliograph.Engine which must be inside the build context.
      context: ../backend
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__HeliographDb: Host=db;Port=5432;Database=heliograph;Username=heliograph;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_SIGNING_KEY}
      Admin__BootstrapEmail: ${Admin__BootstrapEmail:-}
    volumes:
      # Bind mount, not a named volume — lands log files directly on the host filesystem at
      # <checkout>/logs (repo root, one level up from this compose file in infra/) so they're
      # readable (tail/cat) without any docker exec/docker-group access.
      # See GOTCHAS.md for the sanctioned retrieval path.
      - ../logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../web
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - default
      - edge
    depends_on:
      - api
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # edge only, not default: its one upstream is caddy, which is on both. Keeping it off
    # default means a compromised cloudflared can't reach api/db directly (TLS-02).
    networks:
      edge:
        ipv4_address: 172.30.53.2
    depends_on:
      - caddy

networks:
  # Caddy <-> cloudflared only. A network of its own, with a fixed subnet, so the Caddyfile can
  # trust exactly one address (172.30.53.2, reserved for the cloudflared service the tunnel adds)
  # rather than all of `default`, which holds api/web/db. Dynamic allocation is confined to
  # .8-.15 so nothing else can ever be handed .2. Declared before cloudflared exists on purpose:
  # the login limiter's trust boundary is in place (and testable) before the tunnel is.
  edge:
    ipam:
      config:
        - subnet: 172.30.53.0/28
          ip_range: 172.30.53.8/29

volumes:
  db-data:
