server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's build output hashes every filename under /assets/ (index-<hash>.js, etc.), so it's
    # safe to cache those forever — a new deploy always ships new filenames, referenced only by
    # the also-updated index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else — index.html, manifest.webmanifest, sw.js/workbox-*.js (vite-plugin-pwa's
    # unhashed service-worker script), and the static icon set — must be revalidated on every
    # request. Get this wrong for sw.js specifically and an installed PWA client never sees a new
    # deploy: the browser (or an intermediate cache) keeps serving the old service worker
    # indefinitely, silently, with no error anywhere.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
