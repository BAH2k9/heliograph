<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Heliograph mark: a sun disc and the flash its mirror throws. Two flat shapes, no text,
       drawn to stay legible at 16 px. Keep in sync with src/components/Logo.tsx. -->
  <style>
    @media (prefers-color-scheme: light) {
      .sun { fill: #B0761A }
      .flash { fill: #D39A2A }
    }
  </style>
  <circle class="sun" cx="18.34" cy="29.66" r="11" fill="#E0A030"/>
  <polygon class="flash" points="27.36,18.87 29.13,20.64 45.92,13.39 34.61,2.08" fill="#F5C95A"/>
</svg>
