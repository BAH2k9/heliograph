<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Heliograph mark: a Mirror tile. A beam enters from the left, strikes the mirrored diagonal
       and turns 90° out through the top. Flat fills, no text. The beam's edges sit on 21/27, whole
       pixels at both 16 and 32 px. The mark carries its own dark tile, so it needs no light-scheme
       override. Keep in sync with src/components/Logo.tsx and icon-src/maskable.svg. -->
  <rect width="48" height="48" rx="10" fill="#171B21"/>
  <polygon points="39,9 39,39 9,39" fill="#A7D8E6"/>
  <polygon points="0,21 21,21 21,0 27,0 27,21 21,27 0,27" fill="#E0A030"/>
</svg>
